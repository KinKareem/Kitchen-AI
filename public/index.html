<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tulis bahan yang ada di dapurmu, dapat saran masakan yang bisa dibuat." />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23173A28'/><circle cx='16' cy='16' r='7' fill='%23F3B61F'/></svg>" />
  <title>Dapur AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <header class="head">
    <div class="wrap"><a class="brand" href="/">Dapur AI</a></div>
  </header>

  <main class="wrap">
    <form class="ask" id="search-form">
      <label class="ask__lead" for="bahan">Di dapurku ada</label>
      <div class="ask__field">
        <input id="bahan" class="ask__input" placeholder="telur, tahu, cabai, kecap" maxlength="300"
          autocomplete="off" />
      </div>
      <div class="ask__actions">
        <button class="btn" type="submit" id="submit-btn" disabled>Cari resep</button>
        <p class="eg-line" id="examples">
          Belum kepikiran? Coba:
          <button type="button" class="eg" data-example="telur, tahu, cabai, kecap">telur, tahu, cabai, kecap</button>
          <button type="button" class="eg" data-example="ayam, bawang putih, kecap manis">ayam, bawang putih, kecap
            manis</button>
          <button type="button" class="eg" data-example="nasi, telur, bawang merah">nasi, telur, bawang merah</button>
        </p>
      </div>
    </form>

    <div class="note note--error" id="error" role="alert" hidden></div>
    <p class="read" id="detected" hidden></p>
    <div class="note" id="notice" role="status" hidden></div>

    <section class="results" id="results" aria-live="polite" aria-busy="false"></section>

    <div class="more" id="reload" hidden>
      <button type="button" class="btn" id="reload-btn">Tampilkan opsi lain</button>
      <p>Bahan yang sama, resep yang berbeda.</p>
    </div>
  </main>

  <footer class="wrap foot">
    <p>
      Resep dari TheMealDB. Penjelasan dan terjemahan dibuat AI, jadi periksa lagi takaran dan
      langkahnya sebelum memasak.
    </p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>

</html>
