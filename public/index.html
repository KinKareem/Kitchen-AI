<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tulis bahan yang ada di dapurmu, dapat saran masakan yang bisa dibuat." />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230B2316'/><circle cx='16' cy='16' r='8' fill='%23BDE35A'/></svg>" />
  <title>Dapur AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/"><span class="brand__mark" aria-hidden="true"></span>Dapur AI</a>
    </header>

    <main>
      <section class="hero glass">
        <div class="hero__plant" id="plant" aria-hidden="true"></div>
        <div class="hero__body">
          <p class="eyebrow">Resep dari isi kulkasmu</p>
          <h1 class="hero__title">
            <span class="line"><span>Masak apa</span></span>
            <span class="line"><span>hari ini?</span></span>
          </h1>
          <p class="hero__sub">Tulis bahan yang ada, kami carikan masakannya.</p>

          <form id="search-form">
            <label class="sr-only" for="bahan">Bahan yang kamu punya</label>
            <div class="ask__box">
              <input id="bahan" class="ask__input" placeholder="telur, tahu, cabai, kecap" maxlength="300"
                autocomplete="off" />
              <button class="btn-cream" type="submit" id="submit-btn" disabled>Cari resep</button>
            </div>
          </form>

          <div class="hero__pills" id="examples">
            <span>Coba</span>
            <button type="button" class="pill" data-example="telur, tahu, cabai, kecap">telur, tahu, cabai,
              kecap</button>
            <button type="button" class="pill" data-example="ayam, bawang putih, kecap manis">ayam, bawang putih, kecap
              manis</button>
            <button type="button" class="pill" data-example="nasi, telur, bawang merah">nasi, telur, bawang
              merah</button>
          </div>
        </div>
      </section>

      <div class="note note--error" id="error" role="alert" hidden></div>
      <p class="read" id="detected" hidden></p>
      <div class="note" id="notice" role="status" hidden></div>

      <section class="results" id="results" aria-live="polite" aria-busy="false"></section>

      <div class="more" id="reload" hidden>
        <button type="button" class="btn-cream" id="reload-btn">
          <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
          <span id="reload-label">Tampilkan opsi lain</span>
        </button>
      </div>
    </main>
  </div>

  <footer class="foot">
    <p>
      Resep dari TheMealDB. Penjelasan dan terjemahan dibuat AI, jadi periksa lagi takaran dan
      langkahnya sebelum memasak.
    </p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>

</html>
